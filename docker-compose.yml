version: '3.8'

services:
  nova-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "14320:8000"
    volumes:
      - ./backend/app/tts_files:/app/app/tts_files
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-mini}
      - NOVITA_API_KEY=${NOVITA_API_KEY}
      - NOVITA_API_URL=${NOVITA_API_URL:-https://api.novita.ai/v3beta/flux-1-schnell}
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: unless-stopped